name: Bootstrap research labels and milestones

on:
  workflow_dispatch:
  push:
    branches:
      - RUSSEL_SP
    paths:
      - .github/workflows/bootstrap-research-management.yml

permissions:
  issues: write
  contents: read

concurrency:
  group: research-management-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/RUSSEL_SP'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create missing labels and milestones
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          api = os.environ["API_URL"].rstrip("/")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}/repos/{repo}/{path}", data=data, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      return json.loads(response.read().decode()) if response.status != 204 else None
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")
                  if exc.code == 422 and method == "POST":
                      print(f"Already exists or validation conflict: {path}: {detail[:250]}")
                      return None
                  raise RuntimeError(f"{method} {path} failed ({exc.code}): {detail[:500]}")

          labels = [
              ("C.1-classification", "1D76DB", "Active-only sample and strategy classification"),
              ("C.2-counterfactual", "1D76DB", "No-trade drift counterfactual"),
              ("C.3-performance-flows", "1D76DB", "Performance and flow decomposition"),
              ("C.4-provider-bridge", "1D76DB", "TR/CRSP provider linkage"),
              ("C.5-distribution", "1D76DB", "Distribution and mandate exposure"),
              ("C.6-survival", "1D76DB", "Entrant selection and survival"),
              ("C.7-russell-migration", "1D76DB", "Russell migration and price discovery"),
              ("C.8-commercial", "1D76DB", "Commercial economics"),
              ("validated", "0E8A16", "Evidence reviewed and validated; not merely workflow success"),
              ("needs-validation", "FBCA04", "Technical output exists but evidence audit remains"),
              ("failed-test", "B60205", "A test or acceptance criterion failed"),
              ("inconclusive", "D4C5F9", "Evidence does not resolve the research question"),
              ("falsified", "5319E7", "A stated prediction was not supported"),
              ("data", "C5DEF5", "Data acquisition, provenance, or quality"),
              ("methodology", "C5DEF5", "Research design, identification, or measurement"),
              ("code", "C5DEF5", "Implementation or automation"),
              ("documentation", "C5DEF5", "Research reports, wiki, or protocol"),
              ("audit", "C5DEF5", "Independent validation or reproducibility audit"),
              ("publication", "C5DEF5", "Synthesis or publication preparation"),
              ("priority-critical", "B60205", "Critical dependency or blocker"),
              ("priority-high", "D93F0B", "High priority"),
              ("priority-medium", "FBCA04", "Medium priority"),
              ("priority-low", "0E8A16", "Low priority"),
          ]

          existing_labels = {x["name"] for x in request("GET", "labels?per_page=100")}
          created_labels = 0
          for name, color, description in labels:
              if name in existing_labels:
                  print(f"KEEP label: {name}")
                  continue
              request("POST", "labels", {"name": name, "color": color, "description": description})
              created_labels += 1
              print(f"CREATE label: {name}")

          milestones = [
              ("M1 — Reproducible Baseline", "Provider-specific source panels, provenance, schema checks, and baseline outputs independently reproducible."),
              ("M2 — Active-Only Classification", "Defensible fund-level strategy labels, as-of timing, ambiguity handling, and sample sensitivity documented."),
              ("M3 — Performance and Flows", "AUM changes decomposed into performance and net flows with share-class and corporate-action adjustments."),
              ("M4 — Provider Bridge", "TR/CRSP identity bridge validated or the provider break explicitly retained."),
              ("M5 — Distribution and Survival", "Exposure measures, entrant cohorts, survival, pre-trends, and selection tests completed."),
              ("M6 — Russell Migration", "Russell 1000/2000 migration design, pre-trends, placebo tests, and outcomes audited."),
              ("M7 — Commercial Economics", "Tier 1 product/channel economics, capacity, competitive context, and contribution margins assessed."),
              ("M8 — Research Synthesis", "Integrated findings, null results, limitations, and reproducibility package completed."),
          ]

          existing_milestones = {x["title"] for x in request("GET", "milestones?state=all&per_page=100")}
          created_milestones = 0
          for title, description in milestones:
              if title in existing_milestones:
                  print(f"KEEP milestone: {title}")
                  continue
              request("POST", "milestones", {"title": title, "description": description, "state": "open"})
              created_milestones += 1
              print(f"CREATE milestone: {title}")

          print(f"SUMMARY labels_created={created_labels} labels_existing={len(labels)-created_labels} "
                f"milestones_created={created_milestones} milestones_existing={len(milestones)-created_milestones}")
          PY
