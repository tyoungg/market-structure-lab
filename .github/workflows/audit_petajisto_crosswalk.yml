name: Audit public Petajisto fund crosswalk

on:
  push:
    branches:
      - RUSSEL_SP
    paths:
      - ".github/workflows/audit_petajisto_crosswalk.yml"
      - "scripts/audit_petajisto_crosswalk.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-public-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RUSSEL_SP
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas gdown
      - name: Download public Notre Dame TR data
        run: |
          mkdir -p /tmp/active-share
          gdown "1fbdBoASGj-h2XAng-3FVmZzeJI6gcHx1" -O /tmp/active-share/tr_active_share.zip
      - name: Download public Petajisto file
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            -A "The Rational Coward research project contact research@example.org" \
            "https://www.petajisto.net/data/activeshare.csv" \
            -o /tmp/active-share/petajisto_activeshare.csv
          test -s /tmp/active-share/petajisto_activeshare.csv
          head -c 200 /tmp/active-share/petajisto_activeshare.csv
      - name: Run identifier matching audit
        run: |
          python scripts/audit_petajisto_crosswalk.py \
            --tr-zip /tmp/active-share/tr_active_share.zip \
            --petajisto /tmp/active-share/petajisto_activeshare.csv \
            --out bridge_outputs
      - name: Upload derived audit outputs only
        uses: actions/upload-artifact@v4
        with:
          name: petajisto-public-bridge-audit
          path: bridge_outputs/**
          if-no-files-found: error
          retention-days: 30
