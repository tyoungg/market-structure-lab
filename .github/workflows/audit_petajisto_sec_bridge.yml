name: Audit Petajisto to SEC public series and class bridge

on:
  push:
    branches:
      - RUSSEL_SP
    paths:
      - ".github/workflows/audit_petajisto_sec_bridge.yml"
      - "scripts/audit_petajisto_sec_bridge.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sec-public-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RUSSEL_SP
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests tabulate gdown
      - name: Download public Notre Dame TR data
        run: |
          mkdir -p /tmp/active-share
          gdown "1fbdBoASGj-h2XAng-3FVmZzeJI6gcHx1" -O /tmp/active-share/tr_active_share.zip
      - name: Download public Petajisto data
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            -A "The Rational Coward research project via github.com/tyoungg/market-structure-lab" \
            "https://www.petajisto.net/data/activeshare.csv" \
            -o /tmp/active-share/petajisto_activeshare.csv
          test -s /tmp/active-share/petajisto_activeshare.csv
      - name: Download SEC 2010 series and class snapshot
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            -A "The Rational Coward Research Project (tyoungg/market-structure-lab; public research)" \
            "https://www.sec.gov/files/investment/data/other/investment-company-series-and-class-information/investmentcompanyseriesclass2010.csv" \
            -o /tmp/active-share/sec_series_class_2010.csv
          test -s /tmp/active-share/sec_series_class_2010.csv
          head -c 500 /tmp/active-share/sec_series_class_2010.csv
      - name: Build SEC bridge and retrieve actual filing evidence
        run: |
          python scripts/audit_petajisto_sec_bridge.py \
            --tr-zip /tmp/active-share/tr_active_share.zip \
            --petajisto /tmp/active-share/petajisto_activeshare.csv \
            --sec-series-class /tmp/active-share/sec_series_class_2010.csv \
            --out sec_bridge_outputs \
            --max-filings-per-cik-year 2
      - name: Upload derived audit outputs only
        uses: actions/upload-artifact@v4
        with:
          name: petajisto-sec-public-bridge-audit
          path: sec_bridge_outputs/**
          if-no-files-found: error
          retention-days: 30
