name: Historical N-SAR series linkage feasibility

on:
  push:
    branches:
      - RUSSEL_SP
    paths:
      - ".github/workflows/audit_nsar_series_linkage.yml"
      - "scripts/audit_nsar_series_linkage.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  nsar-linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RUSSEL_SP
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests
      - name: Download prior bounded SEC coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: bounded-historical-sec-coverage
          repository: tyoungg/market-structure-lab
          run-id: 44966589936
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior_sec_coverage
      - name: Validate inputs and script
        run: |
          python -m py_compile scripts/audit_nsar_series_linkage.py
          test -s prior_sec_coverage/sec_historical_coverage_by_series.csv
          test -s prior_sec_coverage/sec_historical_filing_candidates.csv
      - name: Scan bounded historical N-SAR headers
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          mkdir -p nsar_outputs
          timeout 50m python scripts/audit_nsar_series_linkage.py \
            --series-csv prior_sec_coverage/sec_historical_coverage_by_series.csv \
            --candidate-csv prior_sec_coverage/sec_historical_filing_candidates.csv \
            --out nsar_outputs \
            --max-runtime-minutes 43
      - name: Upload derived audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: historical-nsar-series-linkage
          path: nsar_outputs/**
          if-no-files-found: error
          retention-days: 30
