name: Publish GitHub Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - RUSSEL_SP
    paths:
      - docs/wiki/**
      - .github/workflows/publish-wiki.yml

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/RUSSEL_SP'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RUSSEL_SP
      - name: Require Wiki publishing token
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: |
          if [ -z "$WIKI_PUSH_TOKEN" ]; then
            echo "::error::Create the WIKI_PUSH_TOKEN Actions secret before publishing."
            exit 1
          fi
      - name: Publish version-controlled Wiki pages
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          # Keep the credential out of the clone URL. This also safely handles
          # token characters that would otherwise be parsed as URL delimiters.
          AUTH_HEADER="$(printf 'x-access-token:%s' "$WIKI_PUSH_TOKEN" | base64 -w 0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" clone \
            "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-publish
          rsync -av --exclude=.git docs/wiki/ wiki-publish/
          cd wiki-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "Publish Wiki from ${GITHUB_SHA}"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" push
