name: N-PORT pilot tests

on:
  push:
    branches:
      - research/no-trade-large-cap
    paths:
      - "scripts/run_nport_pilot.py"
      - "tests/test_nport_pilot.py"
      - ".github/workflows/nport-pilot-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_nport_pilot.py"
      - "tests/test_nport_pilot.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas
      - run: python -m unittest discover -s tests -v
