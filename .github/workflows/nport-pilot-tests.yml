name: N-PORT pilot tests

on:
  push:
    branches:
      - research/no-trade-large-cap
    paths:
      - "scripts/run_nport_pilot.py"
      - "tests/test_nport_pilot.py"
      - ".github/workflows/nport-pilot-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_nport_pilot.py"
      - "tests/test_nport_pilot.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas
      - run: python -m unittest discover -s tests -v

  return-coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public-data dependencies
        run: python -m pip install --upgrade pip pandas requests yfinance
      - name: Download SEC 2026 Q3 N-PORT archive
        run: |
          mkdir -p data
          curl --fail --location --retry 5 --retry-delay 10 \
            --user-agent "MarketStructureLab research (https://github.com/tyoungg/market-structure-lab)" \
            "https://www.sec.gov/files/dera/data/form-n-port-data-sets/2026q3_nport.zip" \
            --output data/2026q3_nport.zip
          unzip -t data/2026q3_nport.zip | tail -n 2
      - name: Run AB / IVV return-coverage pilot
        run: |
          python scripts/run_nport_pilot.py \
            --archive data/2026q3_nport.zip \
            --active-series S000010411 \
            --benchmark-series S000004310 \
            --start-date 2026-05-31 \
            --end-date 2026-06-30 \
            --fetch-returns \
            --output-dir data/nport_pilot
      - name: Upload pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-ivv-return-coverage
          path: data/nport_pilot/
          if-no-files-found: warn
          retention-days: 14
