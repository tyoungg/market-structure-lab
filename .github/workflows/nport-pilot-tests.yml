name: N-PORT pilot tests

on:
  push:
    branches:
      - research/no-trade-large-cap
    paths:
      - "scripts/run_nport_pilot.py"
      - "tests/test_nport_pilot.py"
      - "scripts/run_nport_return_coverage.py"
      - "data/nport_pilot_inputs/**"
      - ".github/workflows/nport-pilot-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_nport_pilot.py"
      - "tests/test_nport_pilot.py"
      - "scripts/run_nport_return_coverage.py"
      - "data/nport_pilot_inputs/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas
      - run: python -m unittest discover -s tests -v

  return-coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public-data dependencies
        run: python -m pip install --upgrade pip pandas requests yfinance
      - name: Run AB / IVV return-coverage pilot
        run: |
          python scripts/run_nport_return_coverage.py \
            --input-dir data/nport_pilot_inputs \
            --start-date 2026-05-31 \
            --end-date 2026-06-30 \
            --output-dir data/nport_pilot_returns
      - name: Upload pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-ivv-return-coverage
          path: data/nport_pilot_returns/
          if-no-files-found: warn
          retention-days: 14
