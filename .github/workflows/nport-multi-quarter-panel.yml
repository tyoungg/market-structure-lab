name: N-PORT multi-quarter panel

on:
  push:
    branches:
      - research/no-trade-large-cap
    paths:
      - "scripts/run_nport_panel.py"
      - "scripts/run_nport_pilot.py"
      - "tests/test_nport_panel.py"
      - "tests/test_nport_dashboard.py"
      - "data/nport_panel/**"
      - ".github/workflows/nport-multi-quarter-panel.yml"
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping panel runs from pushing from stale checkouts.
concurrency:
  group: nport-panel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas huggingface_hub
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  panel:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public-data dependencies
        run: python -m pip install --upgrade pip pandas pyarrow huggingface_hub requests yfinance
      - name: Run four-quarter, eleven-fund panel
        run: |
          python scripts/run_nport_panel.py \
            --funds data/nport_panel/sample_funds.csv \
            --partitions 2025Q4 2026Q1 2026Q2 2026Q3 \
            --start-date 2025-07-01 \
            --end-date 2026-09-30 \
            --output-dir data/nport_panel_output
      - name: Publish compact dashboard outputs to research branch
        if: success()
        run: |
          mkdir -p data/nport_dashboard
          cp data/nport_panel_output/panel_summary.json data/nport_dashboard/
          cp data/nport_panel_output/fund_interval_results.csv data/nport_dashboard/
          cp data/nport_panel_output/observation_availability.csv data/nport_dashboard/
          cp data/nport_panel_output/uncovered_positions.csv data/nport_dashboard/
          cp data/nport_panel_output/security_crosswalk.csv data/nport_dashboard/
          cp data/nport_panel_output/filing_resolution.csv data/nport_dashboard/
          cp data/nport_panel_output/sample_funds.csv data/nport_dashboard/
      - name: Commit and push dashboard data safely
        if: success()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve this run's complete generated outputs outside the Git
          # worktree. Rebase is inappropriate for generated snapshots: two
          # valid runs can replace the same CSV/JSON files.
          PUBLISH_DIR="$RUNNER_TEMP/nport-dashboard-output"
          mkdir -p "$PUBLISH_DIR"
          cp data/nport_panel_output/panel_summary.json "$PUBLISH_DIR/"
          cp data/nport_panel_output/fund_interval_results.csv "$PUBLISH_DIR/"
          cp data/nport_panel_output/observation_availability.csv "$PUBLISH_DIR/"
          cp data/nport_panel_output/uncovered_positions.csv "$PUBLISH_DIR/"
          cp data/nport_panel_output/security_crosswalk.csv "$PUBLISH_DIR/"
          cp data/nport_panel_output/filing_resolution.csv "$PUBLISH_DIR/"
          cp data/nport_panel_output/sample_funds.csv "$PUBLISH_DIR/"

          # Start each attempt from the current remote branch tip, then apply
          # this run's outputs as one atomic snapshot. No force-push or merge
          # of competing generated files.
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git switch --force-create "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            cp "$PUBLISH_DIR"/* data/nport_dashboard/
            git add data/nport_dashboard/*.json data/nport_dashboard/*.csv

            if git diff --cached --quiet; then
              echo "Dashboard outputs are unchanged; nothing to commit."
              exit 0
            fi

            git commit -m "Publish latest N-PORT dashboard data"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Published dashboard snapshot successfully."
              exit 0
            fi

            echo "Push attempt $attempt lost a race; retrying from the newest remote tip."
          done

          echo "Could not publish dashboard data after three safe push attempts."
          exit 1
      - name: Upload panel outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nport-eleven-fund-four-quarter-panel
          path: data/nport_panel_output/
          if-no-files-found: warn
          retention-days: 30
