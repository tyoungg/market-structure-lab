name: C2 SEC N-PORT holdings acquisition pilot

on:
  workflow_dispatch:
  push:
    branches:
      - RUSSEL_SP
    paths:
      - ".github/workflows/c2_nport_pilot.yml"
      - "scripts/audit_c2_nport_pilot.py"
      - "tests/test_c2_nport_pilot.py"
      - "research/C2_NPORT_PILOT_PROTOCOL.md"

permissions:
  contents: read

jobs:
  nport-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Validate N-PORT parser
        run: python -m unittest discover -s tests -p "test_c2_nport_pilot.py" -v

      - name: Download and validate frozen SEC N-PORT reports
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          timeout 20m python scripts/audit_c2_nport_pilot.py --out c2_nport_pilot

      - name: Upload C2 N-PORT acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2-nport-acquisition-pilot
          path: c2_nport_pilot/**
          if-no-files-found: error
          retention-days: 30
