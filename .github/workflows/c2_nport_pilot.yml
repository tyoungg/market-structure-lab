name: C2 SEC N-PORT holdings acquisition pilot

on:
  workflow_dispatch:
  push:
    branches:
      - RUSSEL_SP
    paths:
      - "scripts/audit_c2_nport_pilot.py"
      - "tests/test_c2_nport_pilot.py"
      - "research/C2_NPORT_PILOT_PROTOCOL.md"

permissions:
  contents: read

jobs:
  nport-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pandas yfinance==1.8.0

      - name: Validate N-PORT parser and no-trade formulas
        run: |
          python -m unittest discover -s tests -p "test_c2_nport_pilot.py" -v
          python -m unittest discover -s tests -p "test_c2_no_trade_drift_pilot.py" -v

      - name: Download and validate frozen SEC N-PORT reports
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          timeout 20m python scripts/audit_c2_nport_pilot.py --out c2_nport_pilot

      - name: Calculate no-trade drift and Active Share decomposition
        run: |
          timeout 20m python scripts/build_c2_no_trade_drift_pilot.py \
            --input c2_nport_pilot \
            --out c2_no_trade_drift

      - name: Upload C2 N-PORT and no-trade drift artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2-no-trade-drift-pilot
          path: |
            c2_nport_pilot/**
            c2_no_trade_drift/**
          if-no-files-found: error
          retention-days: 30
