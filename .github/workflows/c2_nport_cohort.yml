name: C2 Multi-Fund SEC N-PORT Cohort Acquisition

on:
  workflow_dispatch:
  push:
    branches:
      - RUSSEL_SP
    paths:
      - ".github/workflows/c2_nport_cohort.yml"
      - "scripts/audit_c2_nport_cohort.py"
      - "tests/test_c2_nport_cohort.py"
      - "research/C2_COHORT_MANIFEST.csv"
      - "research/C2_COHORT_SELECTION_PROTOCOL.md"

permissions:
  contents: read

jobs:
  nport-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Validate parser and cohort manifest
        run: |
          python -m unittest discover -s tests -p "test_c2_nport_pilot.py" -v
          python -m unittest discover -s tests -p "test_c2_nport_cohort.py" -v

      - name: Download and validate 16 frozen SEC N-PORT reports
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          timeout 20m python scripts/audit_c2_nport_cohort.py \
            --manifest research/C2_COHORT_MANIFEST.csv \
            --out c2_nport_cohort

      - name: Upload C2 multi-fund N-PORT cohort artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2-multifund-nport-cohort
          path: c2_nport_cohort/**
          if-no-files-found: error
          retention-days: 30
