name: C2 Multi-Fund SEC N-PORT Cohort Acquisition
# C2 validation: preserve the 2025 baseline and add a separate 2026 H1 replication window.

on:
  workflow_dispatch:
  push:
    branches:
      - RUSSEL_SP
    paths:
      - ".github/workflows/c2_nport_cohort.yml"
      - "scripts/audit_c2_nport_cohort.py"
      - "scripts/audit_c2_nport_pilot.py"
      - "scripts/map_c2_cohort_identifiers.py"
      - "scripts/build_c2_cohort_no_trade_drift.py"
      - "scripts/build_c2_no_trade_drift_pilot.py"
      - "scripts/build_c2_security_residual_attribution.py"
      - "scripts/audit_optimum_manager_transition.py"
      - "tests/test_c2_no_trade_drift_pilot.py"
      - "tests/test_c2_nport_pilot.py"
      - "tests/test_c2_nport_cohort.py"
      - "tests/test_c2_identifier_mapping.py"
      - "tests/test_c2_cohort_drift.py"
      - "tests/test_c2_security_residual_attribution.py"
      - "tests/test_optimum_manager_transition.py"
      - "research/C2_COHORT_MANIFEST.csv"
      - "research/C2_COHORT_SELECTION_PROTOCOL.md"
      - "research/C2_COHORT_FUND_FLAGS.json"
      - "research/C2_STRATEGY_EVIDENCE_REVIEW.md"
      - "research/OPTIMUM_SUBADVISER_ALLOCATIONS_2025.csv"
      - "research/C2_COHORT_MANIFEST_2026_H1.csv"
      - "research/C2_COHORT_FUND_FLAGS_2026_H1.json"

permissions:
  contents: read

jobs:
  nport-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pandas yfinance

      - name: Validate parser, cohort manifest, identifier mapping, drift, and residual attribution
        run: |
          python -m unittest discover -s tests -p "test_c2_nport_pilot.py" -v
          python -m unittest discover -s tests -p "test_c2_nport_cohort.py" -v
          python -m unittest discover -s tests -p "test_c2_identifier_mapping.py" -v
          python -m unittest discover -s tests -p "test_c2_cohort_drift.py" -v
          python -m unittest discover -s tests -p "test_c2_security_residual_attribution.py" -v
          python -m unittest discover -s tests -p "test_optimum_manager_transition.py" -v

      - name: Download and validate 24 frozen SEC N-PORT reports
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          timeout 20m python scripts/audit_c2_nport_cohort.py \
            --manifest research/C2_COHORT_MANIFEST.csv \
            --out c2_nport_cohort

      - name: Audit Optimum three-filing holdings and published sub-adviser allocations
        run: |
          timeout 5m python scripts/audit_optimum_manager_transition.py \
            --input c2_nport_cohort \
            --out c2_nport_cohort \
            --allocations research/OPTIMUM_SUBADVISER_ALLOCATIONS_2025.csv

      - name: Map cohort securities with N-PORT tickers and OpenFIGI
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          timeout 20m python scripts/map_c2_cohort_identifiers.py \
            --input c2_nport_cohort \
            --out c2_nport_cohort \
            --start-date 2025-09-30

      - name: Calculate six-fund no-trade drift and Active Share decompositions
        run: |
          timeout 35m python scripts/build_c2_cohort_no_trade_drift.py \
            --input c2_nport_cohort \
            --out c2_nport_cohort \
            --start-date 2025-09-30 \
            --end-date 2025-12-31

      - name: Attribute Active Share residual to individual securities
        run: |
          timeout 5m python scripts/build_c2_security_residual_attribution.py \
            --input c2_nport_cohort \
            --out c2_nport_cohort \
            --end-date 2025-12-31

      - name: Download and validate 16 frozen SEC N-PORT reports for 2026 H1
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          timeout 15m python scripts/audit_c2_nport_cohort.py \
            --manifest research/C2_COHORT_MANIFEST_2026_H1.csv \
            --out c2_nport_cohort_2026_h1 \
            --expected-dates 2026-03-31,2026-06-30

      - name: Map 2026 H1 cohort securities with N-PORT tickers and OpenFIGI
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          timeout 20m python scripts/map_c2_cohort_identifiers.py \
            --input c2_nport_cohort_2026_h1 \
            --out c2_nport_cohort_2026_h1 \
            --start-date 2026-03-31

      - name: Calculate 2026 H1 six-fund no-trade drift and Active Share decompositions
        run: |
          timeout 30m python scripts/build_c2_cohort_no_trade_drift.py \
            --input c2_nport_cohort_2026_h1 \
            --out c2_nport_cohort_2026_h1 \
            --start-date 2026-03-31 \
            --end-date 2026-06-30 \
            --flags research/C2_COHORT_FUND_FLAGS_2026_H1.json

      - name: Attribute 2026 H1 Active Share residual to individual securities
        run: |
          timeout 5m python scripts/build_c2_security_residual_attribution.py \
            --input c2_nport_cohort_2026_h1 \
            --out c2_nport_cohort_2026_h1 \
            --start-date 2026-03-31 \
            --end-date 2026-06-30

      - name: Upload C2 acquisition, mapping, drift, and security attribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2-multifund-nport-cohort
          path: |
            c2_nport_cohort/**
            c2_nport_cohort_2026_h1/**
          if-no-files-found: error
          retention-days: 30
